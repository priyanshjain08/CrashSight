<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrashSight</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--mute:#9aa4b0;--accent:#58a6ff;--bad:#f85149;--ok:#3fb950;--warn:#d29922}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
a{color:var(--accent);cursor:pointer;text-decoration:none}a:hover,a:focus-visible{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;gap:16px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0;letter-spacing:.04em}header h1 span{color:var(--accent)}
nav{display:flex;gap:4px;flex:1}nav button{background:none;border:0;color:var(--mute);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button[aria-current=page]{background:var(--panel);color:var(--text)}
main{max-width:1100px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat b{display:block;font-size:26px}.stat span,.mute{color:var(--mute)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500}code,.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
input,select,textarea,button.btn{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
button.btn{cursor:pointer;background:var(--panel)}button.btn:hover{border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;border:1px solid var(--line);font-size:12px}
.s-new,.s-reopened{color:var(--bad)}.s-investigating,.s-confirmed{color:var(--warn)}.s-resolved{color:var(--ok)}.s-ignored{color:var(--mute)}
.unres{color:var(--mute)}.err{color:var(--bad)}.bar{display:inline-block;height:10px;background:var(--accent);border-radius:2px;vertical-align:middle}
.banner{background:#3d2f00;border:1px solid var(--warn);padding:8px 12px;border-radius:6px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 10px}
</style>
</head>
<body>
<header>
  <h1>CRASH<span>SIGHT</span></h1>
  <nav aria-label="Main" id="nav"></nav>
  <label class="mute">Project <select id="project" aria-label="Project"></select></label>
  <button class="btn" id="tokbtn">Admin token</button>
</header>
<main id="app" aria-live="polite"></main>
<script>
"use strict";
const API = "/api/v1";
const state = { project: null, page: "overview" };
const $ = (s) => document.querySelector(s);

function h(tag, attrs, ...kids) {           // DOM builder: text only, never innerHTML
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
  return el;
}

async function api(method, path, body) {
  const tok = sessionStorage.getItem("cs_admin_token") || "";
  const res = await fetch(API + path, { method, headers: { Authorization: "Bearer " + tok, ...(body ? { "Content-Type": "application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data.error && data.error.message) || ("HTTP " + res.status));
  return data;
}

function show(...nodes) { const a = $("#app"); a.replaceChildren(...nodes); }
function loading() { show(h("p", { class: "mute" }, "Loading…")); }
function failure(e, retry) { show(h("div", { class: "card err", role: "alert" }, "Error: " + e.message + " ", retry ? h("button", { class: "btn", onclick: retry }, "Retry") : null)); }
function empty(msg) { return h("p", { class: "mute" }, msg); }
const when = (s) => (s || "").replace("T", " ").replace("Z", " UTC");

async function load(fn) { loading(); try { await fn(); } catch (e) { failure(e, () => load(fn)); } }
const pid = () => state.project;

// ---------------- pages
async function overview() {
  const days = Number(state.days || 30);
  const s = await api("GET", `/stats?project_id=${pid()}&days=${days}`);
  const max = Math.max(1, ...s.trend.map((t) => t.crashes));
  show(
    h("div", { class: "row" }, h("label", {}, "Period ", h("select", { onchange: (e) => { state.days = e.target.value; load(overview); } },
      [7, 30, 90, 365].map((d) => h("option", { value: d, selected: d === days }, d + " days"))))),
    h("div", { class: "grid" }, [["Fatal reports", s.total_fatal_reports], ["Unique groups", s.unique_groups], ["New groups", s.new_groups], ["Diagnostics", s.total_diagnostics]]
      .map(([l, v]) => h("div", { class: "card stat" }, h("b", {}, v), h("span", {}, l)))),
    h("div", { class: "card" }, h("h2", {}, "Crash trend"), s.trend.length ? h("table", {}, s.trend.map((t) => h("tr", {}, h("td", { class: "mono" }, t.day), h("td", {}, t.crashes), h("td", {}, h("span", { class: "bar", style: `width:${Math.round(t.crashes / max * 240)}px` }))))) : empty("No crashes in this period.")),
    h("div", { class: "card" }, h("h2", {}, "Top crash groups"), s.top_groups.length ? h("table", {}, s.top_groups.map((g) => h("tr", {}, h("td", {}, h("a", { onclick: () => group(g.id) }, g.title)), h("td", { class: "s-" + g.status }, g.status), h("td", {}, g.crashes)))) : empty("None.")),
    h("div", { class: "card" }, h("h2", {}, "Crashes by application version"), s.by_version.length ? h("table", {}, s.by_version.map((v) => h("tr", {}, h("td", {}, v.version), h("td", {}, v.crashes)))) : empty("None.")),
    h("div", { class: "card" }, h("h2", {}, "Processing status"), h("p", {}, s.processing.length ? s.processing.map((p) => `${p.status}: ${p.c}`).join("   ") : "No reports yet.")),
    h("div", { class: "card" }, h("h2", {}, "Recent activity"), s.recent_audit.length ? h("table", {}, s.recent_audit.map((a) => h("tr", {}, h("td", { class: "mono" }, when(a.created_at)), h("td", {}, a.actor), h("td", {}, a.action), h("td", { class: "mute" }, a.detail)))) : empty("No activity.")),
    h("p", { class: "mute" }, "Not measured by CrashSight: " + s.not_measured.join("; ") + "."));
}

async function groups() {
  const f = state.gf || { q: "", status: "", sort: "last_seen" };
  const qs = new URLSearchParams({ project_id: pid(), sort: f.sort, limit: 50 });
  if (f.q) qs.set("q", f.q); if (f.status) qs.set("status", f.status);
  const g = await api("GET", "/groups?" + qs);
  const set = (k) => (e) => { state.gf = { ...f, [k]: e.target.value }; load(groups); };
  show(
    h("div", { class: "row" },
      h("input", { type: "search", placeholder: "Search title / type", value: f.q, "aria-label": "Search", onchange: set("q") }),
      h("select", { "aria-label": "Status", onchange: set("status") }, ["", "new", "investigating", "confirmed", "resolved", "reopened", "ignored"].map((s) => h("option", { value: s, selected: s === f.status }, s || "any status"))),
      h("select", { "aria-label": "Sort", onchange: set("sort") }, ["last_seen", "first_seen", "severity", "occurrences"].map((s) => h("option", { value: s, selected: s === f.sort }, "sort: " + s)))),
    g.items.length ? h("div", { class: "card" }, h("table", {}, h("thead", {}, h("tr", {}, ["Crash", "Status", "Severity", "Count", "Versions", "First seen", "Last seen", "Owner"].map((c) => h("th", {}, c)))),
      h("tbody", {}, g.items.map((x) => h("tr", {}, h("td", {}, h("a", { onclick: () => group(x.id) }, x.title)), h("td", { class: "s-" + x.status }, x.status), h("td", {}, x.severity), h("td", {}, x.occurrences), h("td", {}, x.affected_versions.join(", ")), h("td", { class: "mono" }, when(x.first_seen)), h("td", { class: "mono" }, when(x.last_seen)), h("td", {}, x.assignee || "—")))))) : empty("No crash groups match. Ingest a report to see it here."),
    h("p", { class: "mute" }, `${g.total} group(s)`));
}

async function group(id) {
  state.page = "groups"; markNav();
  await load(async () => {
    const g = await api("GET", `/groups/${id}?project_id=${pid()}`);
    const reps = await api("GET", `/reports?project_id=${pid()}&group_id=${id}&limit=20`);
    const latest = reps.items[0] ? await api("GET", `/reports/${reps.items[0].id}?project_id=${pid()}`) : null;
    const patch = (body) => api("PATCH", `/groups/${id}?project_id=${pid()}`, body).then(() => group(id), (e) => alert(e.message));
    const note = h("textarea", { rows: 3, "aria-label": "Note", style: "width:100%" });
    show(
      h("p", {}, h("a", { onclick: () => { state.page = "groups"; render(); } }, "← All groups")),
      h("div", { class: "card" }, h("h2", {}, g.title),
        h("p", { class: "mute" }, g.explanation),
        h("div", { class: "row" },
          h("label", {}, "Status ", h("select", { onchange: (e) => patch({ status: e.target.value }) }, ["new", "investigating", "confirmed", "resolved", "reopened", "ignored"].map((s) => h("option", { value: s, selected: s === g.status }, s)))),
          h("label", {}, "Severity ", h("select", { onchange: (e) => patch({ severity: e.target.value }) }, ["low", "medium", "high", "critical"].map((s) => h("option", { value: s, selected: s === g.severity }, s)))),
          h("label", {}, "Owner ", h("input", { value: g.assignee || "", onchange: (e) => patch({ assignee: e.target.value || null }) }))),
        h("p", {}, `${g.occurrences} occurrence(s) · versions: ${g.affected_versions.join(", ")} · first ${when(g.first_seen)} · last ${when(g.last_seen)}`)),
      latest ? stackCard(latest) : empty("No reports in this group."),
      h("div", { class: "card" }, h("h2", {}, "Related reports"), h("table", {}, reps.items.map((r) => h("tr", {}, h("td", { class: "mono" }, r.report_id), h("td", {}, r.app_version), h("td", { class: "mono" }, when(r.occurred_at)), h("td", {}, r.symbolication_status), h("td", {}, r.processing_status),
        h("td", {}, h("button", { class: "btn", onclick: () => api("POST", `/reports/${r.id}/retry?project_id=${pid()}`).then(() => group(id), (e) => alert(e.message)) }, "Reprocess")))))),
      h("div", { class: "card" }, h("h2", {}, "Investigation notes"), g.notes.length ? g.notes.map((n) => h("p", {}, h("b", {}, n.author), " ", h("span", { class: "mute" }, when(n.created_at)), h("br"), n.body)) : empty("No notes yet."),
        note, h("div", { class: "row" }, h("button", { class: "btn", onclick: () => note.value.trim() && api("POST", `/groups/${id}/notes?project_id=${pid()}`, { body: note.value }).then(() => group(id), (e) => alert(e.message)) }, "Add note"))),
      h("div", { class: "card" }, h("h2", {}, "History (audit)"), g.history.length ? h("table", {}, g.history.map((a) => h("tr", {}, h("td", { class: "mono" }, when(a.created_at)), h("td", {}, a.actor), h("td", {}, a.action), h("td", { class: "mute" }, a.detail)))) : empty("No changes yet.")));
  });
}

function stackCard(r) {
  return h("div", { class: "card" }, h("h2", {}, `Stack trace — report ${r.report_id.slice(0, 8)}`),
    h("p", { class: "mute" }, `${r.crash_type} at ${r.fault_address} · ${r.app_name} ${r.app_version} (${r.environment}) · ${r.os || "?"}/${r.architecture || "?"} · pid ${r.process_id} tid ${r.thread_id} · symbolication: ${r.symbolication_status}`),
    h("p", { class: "mute" }, `Capture: ${r.capture_method}. ${r.capture_limitations}`),
    r.frames.length ? h("table", { class: "mono" }, r.frames.map((f) => h("tr", {}, h("td", {}, "#" + f.index),
      h("td", { class: f.status === "symbolicated" ? "" : "unres" }, f.status === "symbolicated" ? f.function : "unresolved (" + f.status.replace("unresolved_", "") + ")"),
      h("td", {}, f.source_file ? `${f.source_file}:${f.line ?? "?"}` : ""), h("td", { class: "mute" }, `${f.module.split("/").pop()}+0x${f.module_offset.toString(16)}`)))) : empty("No frames captured."),
    Object.keys(r.context).length ? h("p", {}, "Context (sensitive keys masked): ", h("code", {}, JSON.stringify(r.context))) : null);
}

async function projects() {
  const p = await api("GET", "/projects");
  const name = h("input", { placeholder: "New project name", "aria-label": "Project name" });
  const cards = [];
  for (const proj of p.items) {
    const keys = await api("GET", `/projects/${proj.id}/keys`);
    cards.push(h("div", { class: "card" }, h("h2", {}, `${proj.name} (#${proj.id})`),
      h("table", {}, keys.items.map((k) => h("tr", {}, h("td", { class: "mono" }, k.prefix + "…"), h("td", {}, when(k.created_at)), h("td", {}, k.revoked_at ? "revoked" : h("button", { class: "btn", onclick: () => api("DELETE", `/projects/${proj.id}/keys/${k.id}`).then(() => load(projects)) }, "Revoke"))))),
      h("div", { class: "row" }, h("button", { class: "btn", onclick: () => api("POST", `/projects/${proj.id}/keys`).then((r) => { alert("New API key (shown once — copy it now):\n\n" + r.key); load(projects); }, (e) => alert(e.message)) }, "Create API key"))));
  }
  show(h("div", { class: "row" }, name, h("button", { class: "btn", onclick: () => api("POST", "/projects", { name: name.value }).then((r) => { alert("Project created. API key (shown once):\n\n" + r.api_key.key); loadProjects(); }, (e) => alert(e.message)) }, "Create project")), ...cards, p.items.length ? null : empty("No projects yet."));
}

async function symbols() {
  const s = await api("GET", `/projects/${pid()}/symbols`);
  show(h("div", { class: "card" }, h("h2", {}, "Registered symbol files"),
    s.items.length ? h("table", {}, h("thead", {}, h("tr", {}, ["Build ID", "Module", "Debug info", "Size", "Uploaded"].map((c) => h("th", {}, c)))), h("tbody", {}, s.items.map((x) => h("tr", {}, h("td", { class: "mono" }, x.build_id), h("td", {}, x.module_name), h("td", {}, x.has_debug_info ? "yes" : "no"), h("td", {}, x.size), h("td", { class: "mono" }, when(x.created_at)))))) : empty("No symbols registered. Upload with scripts/upload_symbols.py using a project API key (see docs/symbolication/guide.md).")));
}

async function audit() {
  const a = await api("GET", `/audit?project_id=${pid()}`);
  show(h("div", { class: "card" }, h("h2", {}, "Audit log"), a.items.length ? h("table", {}, a.items.map((x) => h("tr", {}, h("td", { class: "mono" }, when(x.created_at)), h("td", {}, x.actor), h("td", {}, x.action), h("td", {}, x.target), h("td", { class: "mute" }, x.detail)))) : empty("Empty.")));
}

const PAGES = { overview: ["Overview", overview, true], groups: ["Crash groups", groups, true], symbols: ["Symbols", symbols, true], audit: ["Audit", audit, true], projects: ["Projects", projects, false] };
function markNav() { document.querySelectorAll("#nav button").forEach((b) => b.toggleAttribute("aria-current", b.dataset.p === state.page) || b.removeAttribute("aria-current")); document.querySelectorAll("#nav button").forEach((b) => { if (b.dataset.p === state.page) b.setAttribute("aria-current", "page"); }); }
function render() {
  markNav();
  const [, fn, needsProject] = PAGES[state.page];
  if (!sessionStorage.getItem("cs_admin_token")) return show(h("div", { class: "card" }, "Enter the admin token (button, top right) to load data."));
  if (needsProject && !pid()) return show(empty("Create a project first (Projects page)."));
  load(fn);
}
async function loadProjects() {
  try {
    const p = await api("GET", "/projects");
    const sel = $("#project"); sel.replaceChildren(...p.items.map((x) => h("option", { value: x.id }, x.name)));
    state.project = state.project && p.items.some((x) => x.id == state.project) ? state.project : (p.items[0] && p.items[0].id);
    sel.value = state.project || "";
  } catch (e) { state.project = null; }
  render();
}
$("#nav").append(...Object.entries(PAGES).map(([k, v]) => h("button", { "data-p": k, onclick: () => { state.page = k; render(); } }, v[0])));
$("#project").addEventListener("change", (e) => { state.project = e.target.value; render(); });
$("#tokbtn").addEventListener("click", () => { const t = prompt("Admin token (kept in this tab's sessionStorage only):"); if (t !== null) { sessionStorage.setItem("cs_admin_token", t); loadProjects(); } });
loadProjects();
</script>
</body>
</html>
